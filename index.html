<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to my page!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Page Fade-In Animation */
    @keyframes fadeInPage {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      animation: fadeInPage 1.2s ease-out forwards;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    /* Top Links Header */
    nav {
      display: flex;
      justify-content: flex-start;
      gap: 20px;
      margin-bottom: 50px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid #222222;
      padding-bottom: 15px;
    }

    nav a {
      color: #aaaaaa;
      text-decoration: none;
      transition: color 0.2s ease;
      font-weight: bold;
    }

    nav a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Main Bio Section */
    .bio-section {
      display: flex;
      flex-direction: row;
      gap: 35px;
      align-items: flex-start;
      margin-bottom: 50px;
    }

    @media (max-width: 600px) {
      .bio-section {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }

    .avatar {
      width: 180px;
      height: 180px;
      border: 3px solid #ffffff;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background-color: #222;
    }

    .bio-content {
      flex: 1;
    }

    .greeting {
      color: #888888;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .name {
      font-family: 'Press Start 2P', monospace;
      font-size: 22px;
      line-height: 1.4;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .description {
      color: #cccccc;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    /* Social Buttons */
    .social-links {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .social-btn {
      display: inline-block;
      padding: 10px 18px;
      background-color: #1a1a1a;
      color: #ffffff;
      text-decoration: none;
      border: 1px solid #444444;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    /* Friends Section */
    .friends-section {
      border-top: 1px solid #222222;
      padding-top: 40px;
    }

    .section-title {
      color: #888888;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .friends-header {
      font-family: 'Press Start 2P', monospace;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .friends-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .friend-card {
      background: #141414;
      color: #ffffff;
      padding: 10px 18px;
      border: 1px solid #333333;
      border-radius: 6px;
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigation Header -->
    <nav>
      <a href="https://www.youtube.com/@arzuliny" target="_blank">YouTube</a>
      <a href="https://www.roblox.com/users/4810257539/profile" target="_blank">Roblox</a>
    </nav>

    <!-- Profile Section -->
    <div class="bio-section">
      <!-- Raccoon Avatar -->
      <img src="pfp.png" alt="Arzuliny PFP" class="avatar">

      <div class="bio-content">
        <div class="greeting">HEY, I AM...</div>
        <h1 class="name">ARZULINY</h1>
        <p class="description">
          Welcome to my page! I make videos and I'm a beginner editor. I like cats, and I also make music sometimes.
        </p>

        <!-- Profile Links -->
        <div class="social-links">
          <a href="https://www.youtube.com/@arzuliny" target="_blank" class="social-btn">📺 YouTube Channel</a>
          <a href="https://www.roblox.com/users/4810257539/profile" target="_blank" class="social-btn">🎮 Roblox Profile</a>
        </div>
      </div>
    </div>

    <!-- Friends Section -->
    <div class="friends-section">
      <div class="section-title">MY PEOPLE</div>
      <h2 class="friends-header">FRIENDS.</h2>
      <ul class="friends-list">
        <li class="friend-card">Jane</li>
        <li class="friend-card">Bia</li>
        <li class="friend-card">JayTheMan</li>
        <li class="friend-card">Sharkip</li>
        <li class="friend-card">Vivian</li>
      </ul>
    </div>
  </div>

</body>
</html>
